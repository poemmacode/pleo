name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      CI: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: ci
      DB_PASSWORD: ci
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true
      # Chrome for the Cuprite system specs
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: bin/rails db:create db:schema:load
      - run: bundle exec rspec
      - run: bin/rubocop
      # EOLRails is tracked as a pending upgrade (Rails 8.1 needs Ruby >= 3.3.1); every other warning fails the build.
      - run: bin/brakeman --no-pager --except EOLRails
      - run: bundle exec bundle-audit check --update
      - run: bin/importmap audit
