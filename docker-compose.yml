# Alternative to bin/db + local Redis when Docker is available: docker compose up -d
# Ports match the defaults in api/config/database.yml and config/initializers/sidekiq.rb.
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${USER}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
  redis:
    image: redis:7.2
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  postgres:
