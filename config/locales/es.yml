es:
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d %b"
      long: "%d de %B de %Y"
    day_names: [domingo, lunes, martes, miércoles, jueves, viernes, sábado]
    abbr_day_names: [dom, lun, mar, mié, jue, vie, sáb]
    month_names: [~, enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
    abbr_month_names: [~, ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]
    order: [day, month, year]
  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d %b %H:%M"
      long: "%d de %B de %Y %H:%M"
    am: am
    pm: pm
  activerecord:
    models:
      user: Usuario
      project: Proyecto
      domain: Dominio
    attributes:
      user:
        email: Correo
        password: Contraseña
      project:
        name: Nombre
        monthly_api_budget_cents: Presupuesto mensual de API
      domain:
        host: Host
        verification_method: Método de verificación
  activemodel:
    attributes:
      crawling/crawl_config:
        start_url: URL inicial
        scope: Alcance
        max_pages: Máximo de páginas
        max_depth: Profundidad máxima
        requests_per_second: Peticiones por segundo
        include_patterns: Patrones de inclusión
        exclude_patterns: Patrones de exclusión
        device: Dispositivo
        render_js: Renderizado JS
        terms_accepted: Términos del sitio
        pagespeed_sample: Páginas a medir
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: no puede estar vacío
      taken: ya está en uso
      invalid: no es válido
      inclusion: no está incluido en la lista
      too_long: es demasiado largo (máximo %{count} caracteres)
      too_short: es demasiado corto (mínimo %{count} caracteres)
      not_a_number: no es un número
      not_an_integer: debe ser un número entero
      greater_than_or_equal_to: debe ser mayor o igual que %{count}
      confirmation: no coincide con %{attribute}
      required: debe existir
      password_too_long: es demasiado larga
