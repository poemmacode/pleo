    closed: El registro está cerrado. Pide una cuenta al administrador.
    rate_limited: Demasiados registros desde tu red; inténtalo más tarde.
  home:
    show:
      page_title: SEO Platform · Auditorías de SEO técnico para tus sitios web
      meta_description: Rastrea tus sitios, encuentra problemas de SEO técnico, sigue la salud del sitio y exporta informes listos para el cliente.
      hero:
        eyebrow: Auditorías de SEO técnico
        title: Encuentra y corrige lo que impide que tu sitio posicione.
        lead: >-
          SEO Platform rastrea tu web como un buscador, aplica 58 comprobaciones técnicas a cada página y te dice
          qué corregir primero, con una puntuación de salud que puedes seguir crawl tras crawl.
        note: Entra o crea una cuenta para lanzar tu primer crawl.
      cta:
        sign_up: Crear una cuenta gratis
        sign_in: Entrar
      highlights:
        checks:
          value: '58'
          label: comprobaciones técnicas por página
        pages:
          value: '50.000'
          label: páginas por crawl en dominios verificados
        reports:
          value: CSV · Excel · PDF
          label: informes exportables
        api:
          value: API REST
          label: con autenticación por token
      features:
        title: Todo lo que necesitas para una auditoría de SEO técnico
        lead: Desde el primer crawl hasta el informe que entregas a tu cliente o a tu equipo.
        items:
          crawler:
            title: Crawler del sitio
            body: Descubre páginas por enlaces y sitemaps XML, con control del alcance, la profundidad, el límite de páginas, patrones de inclusión y exclusión, y user agent de escritorio o móvil.
          audit:
            title: Auditoría de 58 comprobaciones
            body: Códigos de estado, redirecciones y cadenas, enlaces rotos, títulos y meta descripciones, encabezados, canónicas, indexabilidad, hreflang, imágenes, HTTPS y contenido mixto, y más.
          health:
            title: Puntuación de salud del sitio
            body: Una puntuación global y otra por categoría, comparadas con el crawl anterior, con los problemas ordenados por prioridad para saber qué corregir primero.
          performance:
            title: Core Web Vitals y rendimiento
            body: Mide una muestra de páginas con PageSpeed Insights, combinando datos de laboratorio de Lighthouse con Core Web Vitals de usuarios reales.
          duplicates:
            title: Detección de contenido duplicado
            body: Agrupa páginas con títulos o meta descripciones duplicados o con contenido casi idéntico.
          structured_data:
            title: Validación de datos estructurados
            body: Extrae JSON-LD, Microdata y RDFa, señala tipos y propiedades de schema.org desconocidos y campos que faltan para los resultados enriquecidos.
          reports:
            title: Informes exportables
            body: Páginas e issues en CSV, un Excel completo y un resumen ejecutivo en PDF, listos para compartir.
          live:
            title: Progreso en vivo
            body: Sigue cada crawl en tiempo real y paúsalo, reanúdalo o cancélalo cuando lo necesites.
          api:
            title: API REST
            body: Automatiza proyectos, dominios, crawls y resultados con una API JSON documentada y tokens personales.
          verification:
            title: Verificación de dominios
            body: Demuestra la propiedad con un registro DNS TXT, un archivo o una meta etiqueta para desbloquear crawls más grandes y rápidos.
      steps:
        title: Cómo funciona
        add:
          title: 1. Añade tu sitio
          body: Crea un proyecto y añade los dominios que gestionas. Verifícalos para desbloquear los límites más altos.
        crawl:
          title: 2. Lanza un crawl
          body: Elige el alcance y los límites. El crawler respeta robots.txt y adapta su velocidad al servidor.
        fix:
          title: 3. Corrige lo importante
          body: Revisa los problemas priorizados, abre cualquier página en detalle y exporta el informe para tu equipo.
      audiences:
        title: Pensado para quienes cuidan sitios web
        agencies:
          title: Agencias y consultores
          body: Audita los sitios de tus clientes, muestra el progreso con la puntuación de salud y entrega informes en Excel y PDF.
        teams:
          title: Equipos de marketing
          body: Detecta enlaces rotos, etiquetas que faltan y problemas de indexabilidad antes de que te cuesten tráfico.
        developers:
          title: Desarrolladores
          body: Revisa una versión antes de publicarla y conecta las auditorías a tus herramientas mediante la API.
      trust:
        title: Responsable y seguro por diseño
        items:
          robots: Respeta siempre robots.txt y Crawl-delay, y se identifica con una página pública del bot.
          rate: Límites de velocidad por host que frenan o pausan el crawl automáticamente si un servidor sufre.
          verification: Límites de crawl más altos solo para dominios cuya propiedad has verificado.
          security: Sesiones en servidor, protección CSRF y bloqueo de redes privadas y direcciones internas.
          uptime: Una página de estado pública con chequeos en vivo e historial de uptime.
        status_link: Ver el estado del sistema
        api_link: Leer la documentación de la API
      final:
        title: ¿Quieres saber cómo está de sano tu sitio?
        body: Crea una cuenta, añade tu dominio y obtén tu primera auditoría en minutos.
