      robots_html: It always respects <code>robots.txt</code> (RFC 9309), including <code>Crawl-delay</code>. If robots.txt does not respond, it does not crawl.
      unverified_limits: 'Sites not verified by their owner: at most %{pages} pages at %{rps} requests per second.'
      backoff_html: It slows down or stops on its own if the server answers with 429 or 5xx errors, and respects <code>Retry-After</code>.
